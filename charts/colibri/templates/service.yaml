apiVersion: v1
kind: Service
metadata:
  name: {{ include "colibri.fullname" . }}
  labels:
    {{- include "colibri.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "colibri.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
