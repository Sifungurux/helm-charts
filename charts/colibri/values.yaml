# -- colibri has no published image. images/colibri/Dockerfile in this repo builds
# one (GLM + qwen36 engines; upstream's Dockerfile.slim has GLM only).
image:
  repository: ghcr.io/sifungurux/colibri
  # -- Used only when digest is empty; empty = the chart appVersion.
  tag: ""
  # -- Pulled by digest when set. Tested build: tag bf2442915d6e-9c5d1b8
  # (colibri v2.0.0 + qwen36 engine, from images/colibri/Dockerfile).
  digest: sha256:173819c1b1f53085d972b99c0afce6b8b54cb3eedd5f0f6fb8538ba0f6c8ac03
  pullPolicy: IfNotPresent

# -- 0 frees the node's RAM for another engine; the PVC and model stay.
replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

model:
  # -- colibri catalog id, passed as --model-id and used as the folder name.
  id: qwen3-coder-30b
  # -- Hugging Face repository holding the colibri container.
  repo: Justvugg/Qwen3-Coder-30B-A3B-colibri-int4
  # -- Hugging Face commit to download. Needs colibri >= 2.0.0 (catalog prebuilt_since).
  revision: d839110a17d31b4e6fa9f3d973b751f779b6b9c6

server:
  # -- Port coli serve listens on (passed as --port; coli's own default is 8000).
  port: 5000
  # -- GB of RAM colibri may use for weights and expert cache (--ram, and RAM_GB
  # for engines like qwen36 that only read the env var).
  ramGb: 20
  # -- Expert cache slots per layer (--cap). 0 = the engine sizes it from ramGb.
  # Unset, coli gives qwen36 8 slots/layer: each token re-reads its experts
  # (~0.2 tok/s on an i7-7700). 20 GB holds all 128 experts/layer of the 30B.
  cap: 0
  # -- Accepted Host headers, one --allowed-host flag each. "*" disables the
  # DNS-rebinding guard; rely on the NetworkPolicy, or list the Service DNS names.
  allowedHosts:
    - "*"
  extraArgs: []
  extraEnv: []

# -- API key clients must present. Point at an existing Secret (e.g. from SOPS).
apiKey:
  enabled: true
  existingSecret: colibri-api-key
  secretKey: api-key

persistence:
  # -- Use an existing PVC instead of creating one.
  existingClaim: ""
  # -- Node-local class: Longhorn, 1 replica, dataLocality strict-local
  # (defined in the homelab repo). "" = cluster default.
  storageClass: longhorn-local
  size: 40Gi
  accessModes:
    - ReadWriteOnce
  # -- Keep the PVC (and the downloaded model) when the release is uninstalled.
  keep: true

modelDownload:
  # -- Download Job, named by a hash of its spec. Idempotent: existing files are skipped.
  # The server's init container waits for it. Set HelmRelease timeout high enough.
  enabled: true
  image:
    repository: python
    tag: 3.12-slim
  # -- Optional Secret with an HF token (key: token) for gated repos.
  hfTokenSecret: ""
  activeDeadlineSeconds: 7200
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

service:
  type: ClusterIP
  port: 5000

resources:
  requests:
    cpu: 3500m
    memory: 22Gi
  # -- No CPU limit on purpose: throttling hurts decode speed.
  limits:
    memory: 26Gi

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# /health is the only endpoint that answers without the API key; /v1/* return 401.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 15
  timeoutSeconds: 5

livenessProbe: {}

networkPolicy:
  enabled: true
  # -- Namespaces allowed to call the API.
  ingressNamespaceSelector:
    matchLabels:
      homelab/llm-client: "true"
  # -- Extra egress rules for the server pod. Empty = no egress at all.
  egress: []

# -- Pin to the worker whose NVMe holds the model.
nodeSelector:
  homelab/llm: "true"
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
