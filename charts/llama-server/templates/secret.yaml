{{- if and .Values.apiKey.enabled .Values.apiKey.create }}
{{- $name := include "llama-server.apiKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if and $existing $existing.data }}
{{- $key = index $existing.data .Values.apiKey.secretKey }}
{{- end }}
# Random on first install; read back from the cluster on every upgrade, so the
# key stays stable. Kept on uninstall, like the model PVC.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "llama-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.apiKey.secretKey }}: {{ default (randAlphaNum 48 | b64enc) $key }}
{{- end }}
