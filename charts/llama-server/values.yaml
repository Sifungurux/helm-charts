# -- Built in this repo from a pinned upstream commit (.github/workflows/image.yaml):
# ghcr.io/sifungurux/llama-cpp (ggml-org/llama.cpp) or
# ghcr.io/sifungurux/ik-llama-cpp (ikawrakow/ik_llama.cpp). Both ship the same
# llama-server binary at /app/llama-server; ci/*.yaml has a profile for each.
image:
  repository: ghcr.io/sifungurux/llama-cpp
  # -- Used only when digest is empty. One of the two must be set: builds are
  # tagged <upstream-sha12>-<this-repo-sha7>, so there is no sensible default.
  tag: ""
  # -- Pulled by digest when set (recommended). Copy it from the image
  # workflow's run summary.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- 0 keeps the release installed (model downloaded, Service in place) without
# using the worker's RAM. The benchmark runner scales it up when it is measured.
replicaCount: 1

model:
  # -- Folder name under /model and the model name clients send (--alias).
  id: qwen3-coder-30b
  # -- Hugging Face repository holding the GGUF.
  repo: unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF
  # -- GGUF file in that repository (a single-file quant).
  file: Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
  # -- Hugging Face commit to download. Pin a 40-char SHA: the download Job logs
  # the commit "main" resolved to, so the first run tells you what to pin.
  revision: main
  # -- Expected sha256 of the GGUF. Empty = not checked (the Job logs it).
  sha256: ""

server:
  # -- Port llama-server listens on.
  port: 8080
  # -- Context window (--ctx-size), shared by all slots.
  ctxSize: 16384
  # -- Threads for generation (--threads). 0 = engine default.
  # Decode is memory-bound: physical cores is usually best.
  threads: 4
  # -- Threads for prompt processing (--threads-batch). 0 = same as threads.
  threadsBatch: 0
  # -- Parallel request slots (--parallel). Each gets ctxSize / parallel tokens.
  parallel: 1
  # -- Flash attention (--flash-attn on|off|auto). "" = engine default.
  flashAttn: "on"
  # -- Expose Prometheus /metrics (--metrics). Needs the API key when one is set.
  metrics: true
  # -- Flavour-specific flags, one list item per argv entry, e.g. ["-rtr"] for
  # ik_llama.cpp or ["--jinja"]. Passed after the generated flags.
  extraArgs: []
  extraEnv: []

# -- API key clients must present, mounted as a file (--api-key-file), so it
# never appears in the process arguments. Point at an existing Secret.
apiKey:
  enabled: true
  existingSecret: llama-server-api-key
  secretKey: api-key

persistence:
  # -- Use an existing PVC instead of creating one, e.g. another release's
  # <fullname>-models claim, so two engines share one downloaded GGUF.
  existingClaim: ""
  # -- Node-local class: Longhorn, 1 replica, dataLocality strict-local
  # (defined in the homelab repo). "" = cluster default.
  storageClass: longhorn-local
  size: 40Gi
  accessModes:
    - ReadWriteOnce
  # -- Keep the PVC (and the downloaded model) when the release is uninstalled.
  keep: true

modelDownload:
  # -- Download Job, named by a hash of its spec. Idempotent: an existing file
  # is skipped. Disable it in a release that reuses another release's claim.
  enabled: true
  # -- Init container that holds the server until the model marker for this
  # exact repo, revision and file exists. Works with a shared claim too.
  waitForModel: true
  image:
    repository: python
    tag: 3.12-slim
  # -- Optional Secret with an HF token (key: token) for gated repos.
  hfTokenSecret: ""
  activeDeadlineSeconds: 7200
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 3500m
    memory: 22Gi
  # -- No CPU limit on purpose: throttling hurts decode speed. The GGUF is
  # mmapped, and its page cache counts against this limit.
  limits:
    memory: 26Gi

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# /health answers without the API key in both llama.cpp and ik_llama.cpp,
# with 503 while the model loads.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  failureThreshold: 60

readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 15
  timeoutSeconds: 5

livenessProbe: {}

networkPolicy:
  enabled: true
  # -- Namespaces allowed to call the API.
  ingressNamespaceSelector:
    matchLabels:
      homelab/llm-client: "true"
  # -- Extra egress rules for the server pod. Empty = no egress at all.
  egress: []

# -- Pin to the worker whose NVMe holds the model.
nodeSelector:
  homelab/llm: "true"
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
