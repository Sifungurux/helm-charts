{{- if .Values.networkPolicy.enabled }}
{{- $sub := dict "app.kubernetes.io/name" "zabbix" "app.kubernetes.io/instance" .Release.Name }}
{{- if (dig "postgresql" "enabled" true .Values.zabbix) }}
# PostgreSQL: only the server, the frontend and the probe agent connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zs.prefix" . }}-postgresql
  labels:
    {{- include "zs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml (merge (dict "app.kubernetes.io/component" "postgresql") $sub) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: [{{ .Release.Name | quote }}]
              - key: app.kubernetes.io/component
                operator: In
                values: ["server", "web", "probe-agent"]
      ports:
        - port: {{ dig "postgresql" "service" "port" 5432 .Values.zabbix }}
          protocol: TCP
{{- end }}
{{- if .Values.probeAgent.enabled }}
---
# Probe agent: only the server polls it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zs.prefix" . }}-probe-agent
  labels:
    {{- include "zs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zs.probe.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml (merge (dict "app.kubernetes.io/component" "server") $sub) | nindent 14 }}
      ports:
        - port: 10050
          protocol: TCP
{{- end }}
{{- end }}
