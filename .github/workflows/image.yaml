# colibri publishes no container image, so this builds upstream's
# docker/Dockerfile.slim at the commit pinned in images/colibri/COLIBRI_REF,
# pushes it to GHCR and signs it, with an SBOM and build provenance attached.
# Bumping the image = a PR that changes COLIBRI_REF.
name: image

on:
  push:
    branches: [main]
    paths: ["images/colibri/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  colibri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream ref
        id: ref
        run: |
          sha=$(tr -d '[:space:]' < images/colibri/COLIBRI_REF)
          if ! echo "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::COLIBRI_REF must be a full 40-char commit SHA"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/colibri" >> "$GITHUB_OUTPUT"

      - name: Check out colibri at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: JustVugg/colibri
          ref: ${{ steps.ref.outputs.sha }}
          path: upstream
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/docker/Dockerfile.slim
          platforms: linux/amd64   # Dockerfile.slim targets x86-64-v3 (needs AVX2)
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/JustVugg/colibri
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        run: cosign sign --yes "${{ steps.ref.outputs.image }}@${{ steps.build.outputs.digest }}"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "Set in the HelmRelease values:" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "image:" >> "$GITHUB_STEP_SUMMARY"
          echo "  repository: ${{ steps.ref.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "  digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
