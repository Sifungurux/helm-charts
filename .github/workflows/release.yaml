# Packages every chart whose version is not yet in GHCR, pushes it as an OCI
# artifact and signs it keyless with cosign. Flux verifies the signature
# against this workflow's identity before installing.
name: release

on:
  push:
    branches: [main]
    paths: ["charts/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # keyless signing

env:
  REGISTRY: ghcr.io
  CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Package, push and sign new versions
        run: |
          set -euo pipefail
          repo=$(echo "$CHART_REPO" | tr '[:upper:]' '[:lower:]')
          for chart in charts/*/; do
            name=$(yq '.name' "${chart}Chart.yaml")
            version=$(yq '.version' "${chart}Chart.yaml")
            if helm show chart "oci://$repo/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name $version already published, skipping"
              continue
            fi
            helm package "$chart" -d dist
            out=$(helm push "dist/$name-$version.tgz" "oci://$repo" 2>&1)
            echo "$out"
            digest=$(echo "$out" | awk '/^Digest:/ {print $2}')
            cosign sign --yes "$repo/$name@$digest"
            echo "### $name $version" >> "$GITHUB_STEP_SUMMARY"
            echo "\`oci://$repo/$name@$digest\` (signed)" >> "$GITHUB_STEP_SUMMARY"
          done
