name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s: ["1.34.0", "1.35.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Fetch chart dependencies
        run: |
          for chart in charts/*/; do
            i=0
            for repo in $(yq '.dependencies[]?.repository' "${chart}Chart.yaml" | grep -E '^https?://' | sort -u); do
              i=$((i+1)); helm repo add "dep-$(basename "$chart")-$i" "$repo" >/dev/null
            done
            if [ "$(yq '.dependencies | length' "${chart}Chart.yaml")" != "0" ]; then
              helm dependency update "$chart"
            fi
          done

      - name: helm lint
        run: |
          for chart in charts/*/; do
            set -- "$chart"ci/*.yaml
            if [ -e "$1" ]; then
              for v in "$@"; do helm lint --strict "$chart" -f "$v"; done
            else
              helm lint --strict "$chart"
            fi
          done

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render and validate
        run: |
          for chart in charts/*/; do
            set -- "$chart"ci/*.yaml
            [ -e "$1" ] || set -- ""
            for v in "$@"; do
              echo "== $chart ${v:-(defaults)}"
              helm template ci "$chart" -n ci ${v:+-f "$v"} \
                | kubeconform -strict -summary -ignore-missing-schemas \
                    -kubernetes-version "${{ matrix.k8s }}"
            done
          done

      - name: Version bumped
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth 1 origin "${{ github.base_ref }}"
          for chart in charts/*/; do
            if ! git diff --quiet "origin/${{ github.base_ref }}" -- "$chart"; then
              base=$(git show "origin/${{ github.base_ref }}:${chart}Chart.yaml" 2>/dev/null | yq '.version' || echo none)
              head=$(yq '.version' "${chart}Chart.yaml")
              if [ "$base" = "$head" ]; then
                echo "::error file=${chart}Chart.yaml::$chart changed but version is still $head"
                exit 1
              fi
            fi
          done
