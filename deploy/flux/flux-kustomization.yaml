# Goes under clusters/<cluster>/ in Sifungurux/homelab, if that repo doesn't
# already reconcile apps/ through a parent Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: colibri
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/colibri
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 65m   # outlasts the HelmRelease's 60m first-install timeout
