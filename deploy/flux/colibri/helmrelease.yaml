apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: colibri
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: ./charts/colibri
      sourceRef:
        kind: GitRepository
        name: colibri
  targetNamespace: ai
  releaseName: colibri
  # First install downloads ~19 GB before the server can become ready.
  timeout: 60m
  install:
    remediation:
      retries: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
      strategy: rollback
  values:
    image:
      repository: REPLACE_WITH_REGISTRY/colibri
      digest: sha256:REPLACE_WITH_IMAGE_DIGEST
    model:
      id: qwen3-coder-30b
      repo: Justvugg/Qwen3-Coder-30B-A3B-colibri-int4
      revision: REPLACE_WITH_HF_COMMIT_SHA
    server:
      ramGb: 20
    persistence:
      storageClass: longhorn-local
      size: 40Gi
    nodeSelector:
      homelab/llm: "true"
