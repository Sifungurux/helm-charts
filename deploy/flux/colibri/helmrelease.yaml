apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: colibri
  namespace: flux-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: colibri
  targetNamespace: ai
  releaseName: colibri
  # First install downloads ~19 GB before the server can become ready.
  timeout: 60m
  install:
    remediation:
      retries: 2
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
      strategy: rollback
  values:
    image:
      repository: ghcr.io/sifungurux/colibri
      digest: sha256:REPLACE_WITH_DIGEST_FROM_IMAGE_WORKFLOW
    model:
      id: qwen3-coder-30b
      repo: Justvugg/Qwen3-Coder-30B-A3B-colibri-int4
      revision: d839110a17d31b4e6fa9f3d973b751f779b6b9c6
    server:
      ramGb: 20
    persistence:
      storageClass: longhorn-local
      size: 40Gi
    nodeSelector:
      homelab/llm: "true"
