# Chart source: the signed OCI artifact from Sifungurux/helm-charts.
# Flux refuses any chart not signed by that repo's release workflow.
# Needs Flux >= 2.6 for source.toolkit.fluxcd.io/v1 (use v1beta2 on older installs).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: colibri
  namespace: flux-system
spec:
  interval: 30m
  url: oci://ghcr.io/sifungurux/charts/colibri
  ref:
    semver: ">=0.1.0 <1.0.0"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/Sifungurux/helm-charts/\.github/workflows/release\.yaml@refs/heads/main$
  # Only needed if the GHCR package stays private:
  # secretRef:
  #   name: ghcr-pull
